<div id="search-component">
    <search>
        <form>
            <h4><label for="search-box">Animal Search</label></h4>
            <input #searchBox type="search" name="search-box" id="search-box"
                   (input)="query.set($event.target.value)"/>
        </form>
    </search>

    <section>
        <ul class="search-result">
            @if (resultsResource.isLoading()) {
                <p>Searching…</p>
            }
            @for (animal of resultsResource.value(); track animal.id) {
                <li>
                    <a routerLink="/animals/{{ animal.id }}">
                        {{ animal.animalName }}
                    </a>
                </li>
            }
        </ul>
    </section>
</div>
