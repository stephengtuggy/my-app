<h2>Animals</h2>

<div>
    <label>Animal name:
        <input #animalName/>
    </label>
    <button (click)="add(animalName.value); animalName.value=''">
        add
    </button>
</div>

<ul class="animals">
    @if (animalsResource.isLoading()) {
        <p>Loading…</p>
    }
    @for (animal of animalsResource.value(); track animal.id) {
        <li>
            <a routerLink="/animals/{{animal.id}}">
                <span class="badge">{{ animal.id }}</span> {{ animal.animalName }}
            </a>
            <button class="delete" title="delete animal"
                    (click)="delete(animal)">x
            </button>
        </li>
    }
</ul>
